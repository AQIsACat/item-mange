name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ] # 如果你的默认分支是 master，请改为 ["master"]
  workflow_dispatch: # 允许手动触发运行

permissions:
  contents: read
  pages: write
  id-token: write

# 防止多个构建同时运行导致冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # 【修改点1】升级到 Node 18，解决 EBADENGINE 警告
          # cache: 'npm'       # 启用缓存加速
      
      - name: Install Dependencies
        run: |
          # 强制指定公共镜像源，覆盖 package-lock.json 中的内网地址
          npm config set registry https://registry.npmmirror.com
          
          # 执行安装
          npm ci
        
      - name: Build Project
        run: npm run build
        
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vue CLI 默认打包输出目录是 dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
